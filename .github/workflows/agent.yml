name: agent
on:
  schedule:
    - cron: '17 4-20 * * *'   # hourly 07:17–23:17 Israel time: launches + space weather + OSINT
    - cron: '47 1 * * *'      # nightly: numbers of the week (+ the regular tasks)
  workflow_dispatch:
    inputs:
      tasks:
        description: 'space-separated tasks: osint launches weather numbers'
        default: 'launches weather osint'
concurrency: { group: agent, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Run agent
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          OSINT_WEB_SEARCH: ${{ vars.OSINT_WEB_SEARCH || '0' }}
          OSINT_MAX_ITEMS: ${{ vars.OSINT_MAX_ITEMS || '40' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TASKS="${{ github.event.inputs.tasks }}";
          elif [ "${{ github.event.schedule }}" = "47 1 * * *" ]; then TASKS="launches weather osint numbers";
          else TASKS="launches weather osint"; fi
          npm run agent -- $TASKS
