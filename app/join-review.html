<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>אישור טפסי היכרות · צג חלל</title>
<link rel="icon" href="/assets/logo-mark.png">
<link rel="stylesheet" href="/assets/fonts/v4/fonts.css">
<style>
:root{--bg:#040914;--card:rgba(20,34,64,.62);--line:rgba(150,190,240,.16);--text:#e6f1ff;--muted:#8b9dbd;--accent:#6fd6ea;--lime:#d4f25c;--err:#ff8a8a;--warn:#e9b872}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Heebo',system-ui,sans-serif;line-height:1.5}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,rgba(60,110,200,.3),transparent 60%),var(--bg)}
main{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
header img{width:40px;height:40px}
h1{margin:0;font-size:22px;flex:1}
.tabs{display:flex;gap:6px}
.tabs button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;cursor:pointer}
.tabs button.on{border-color:var(--accent);color:#fff;background:rgba(111,214,234,.14)}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.tools input{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(4,9,20,.6);color:var(--text);font:inherit;min-width:220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;gap:14px;align-items:center}
.av{width:72px;height:72px;border-radius:50%;flex:none;object-fit:cover;border:2px solid var(--accent);background:#0b1430;display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:22px}
.name{font-size:18px;font-weight:700;line-height:1.2}
.sub{color:var(--muted);font-size:14px}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:14px}
dt{color:var(--muted)}dd{margin:0;word-break:break-word}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);margin-inline-end:4px}
.tag.ok{border-color:#8fe0b8;color:#8fe0b8}.tag.no{border-color:var(--warn);color:var(--warn)}
.match{background:rgba(233,184,114,.1);border:1px solid rgba(233,184,114,.4);border-radius:10px;padding:8px 10px;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.actions button{padding:9px 14px;border-radius:10px;border:1px solid var(--accent);background:rgba(111,214,234,.12);color:#fff;font:inherit;cursor:pointer}
.actions button.rej{border-color:var(--line);background:transparent;color:var(--muted)}
.actions button:disabled{opacity:.5;cursor:wait}
.msg{font-size:14px;min-height:1em}.msg.e{color:var(--err)}.msg.k{color:#8fe0b8}
.empty,.gate{color:var(--muted);text-align:center;padding:60px 16px}
.gate input{display:block;margin:12px auto;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(4,9,20,.6);color:var(--text);font:inherit;width:min(100%,420px)}
.gate button{padding:10px 18px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);font:inherit;cursor:pointer}
</style>
</head>
<body>
<main>
  <header>
    <img src="/assets/logo-mark.png" alt="">
    <h1>טפסי היכרות</h1>
    <div class="tabs" id="tabs">
      <button data-s="pending" class="on">ממתינים</button>
      <button data-s="approved">אושרו</button>
      <button data-s="rejected">נדחו</button>
    </div>
  </header>
  <div class="tools"><input id="q" type="search" placeholder="חיפוש לפי שם או אגף"><span id="count"></span><span>· קישור לטופס להפצה: <a id="formLink" href="/join" style="color:var(--accent)" target="_blank">/join</a></span></div>
  <div id="list"></div>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  let token = params.get('t') || '';
  try { if (token) sessionStorage.setItem('reviewToken', token); else token = sessionStorage.getItem('reviewToken') || ''; } catch (e) {}
  if (params.get('t')) history.replaceState(null, '', location.pathname);   // keep the secret out of the address bar
  const list = document.getElementById('list');
  function setFormLink(k) {
    const href = '/join' + (k ? '?k=' + encodeURIComponent(k) : '');
    document.getElementById('formLink').textContent = location.origin + href;
    document.getElementById('formLink').href = href;
  }
  setFormLink('');
  let status = 'pending', items = [];

  const KIND = { civilian: 'אזרח/ית', soldier: 'חובה / קבע', officer: 'קצין/ה', reservist: 'מילואים' };
  const PROFILE = { expertise: 'מומחיות', hobbies: 'תחביבים', fun_fact: 'לא יודעים עליי', space_q: 'לוקח/ת לחלל', upcoming: 'שמחה בדרך', notes: 'ללשכה' };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const d = iso => iso ? iso.split('-').reverse().join('.') : '';

  function gate(msg) {
    list.innerHTML = `<div class="gate"><p>${esc(msg)}</p><input id="tok" type="password" placeholder="קוד גישה"><button id="go">כניסה</button></div>`;
    document.getElementById('go').onclick = () => { token = document.getElementById('tok').value.trim(); try { sessionStorage.setItem('reviewToken', token); } catch (e) {} load(); };
  }

  async function api(method, body) {
    const r = await fetch(`/api/survey?t=${encodeURIComponent(token)}${method === 'GET' ? '&status=' + status : ''}`, method === 'GET' ? {} : { method, headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { gate('הקוד לא תקף. הדביקו את קוד הגישה של הלשכה.'); throw new Error('unauthorized'); }
    if (!r.ok) throw new Error(j.error || 'שגיאה');
    return j;
  }

  async function load() {
    if (!token) return gate('כדי לאשר טפסים צריך קוד גישה (מופיע בקישור שקיבלתם).');
    list.innerHTML = '<div class="empty">טוען...</div>';
    try { const j = await api('GET'); items = j.items; setFormLink(j.formKey); render(); } catch (e) { if (e.message !== 'unauthorized') list.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }

  function render() {
    const q = document.getElementById('q').value.trim();
    const shown = items.filter(s => !q || `${s.first_name} ${s.last_name} ${s.unit || ''} ${s.role || ''}`.includes(q));
    document.getElementById('count').textContent = `${shown.length} טפסים`;
    if (!shown.length) { list.innerHTML = `<div class="empty">${status === 'pending' ? 'אין טפסים שממתינים לאישור 🎉' : 'אין כאן כלום עדיין'}</div>`; return; }
    list.innerHTML = '<div class="grid">' + shown.map(s => {
      const initials = esc((s.first_name[0] || '') + (s.last_name[0] || ''));
      const rows = [
        ['תאריך לידה', d(s.birthday)], ['מעמד', [KIND[s.kind], s.rank].filter(Boolean).join(' · ')],
        ['הצטרפות', d(s.joined_on)], ['סיום צפוי', d(s.leaves_on)], ['מייל', s.email], ['טלפון', s.phone],
        ...Object.entries(PROFILE).map(([k, l]) => [l, s.profile && s.profile[k]]),
      ].filter(([, v]) => v);
      const match = (s.matches || [])[0];
      return `<div class="card" data-id="${s.id}">
        <div class="top">
          ${s.photo ? `<img class="av" src="${esc(s.photo)}" alt="">` : `<div class="av">${initials}</div>`}
          <div><div class="name">${esc(s.first_name)} ${esc(s.last_name)}</div><div class="sub">${esc([s.role, s.unit].filter(Boolean).join(' · '))}</div>
          <div style="margin-top:4px"><span class="tag ${s.consent_wall ? 'ok' : 'no'}">${s.consent_wall ? 'מאשר/ת הצגה בצג' : 'לא להציג בצג'}</span>${s.show_birthday ? '' : '<span class="tag no">בלי יום הולדת</span>'}</div></div>
        </div>
        <dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
        <div class="sub">נשלח ${new Date(s.submitted_at).toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}</div>
        ${status === 'pending' && match ? `<div class="match">כבר קיים/ת במערכת: <b>${esc(match.display_name)}</b>${match.unit ? ' · ' + esc(match.unit) : ''}. אישור יעדכן את הרשומה הקיימת.</div>` : ''}
        ${status === 'pending' ? `<div class="actions">
          <button data-a="approve" data-p="${match ? match.id : ''}">${match ? 'אישור ועדכון הקיים' : 'אישור והוספה'}</button>
          <button data-a="reject" class="rej">דחייה</button>
        </div>` : ''}
        <div class="msg"></div>
      </div>`;
    }).join('') + '</div>';
  }

  list.addEventListener('click', async ev => {
    const b = ev.target.closest('button[data-a]'); if (!b) return;
    const card = b.closest('.card'), msg = card.querySelector('.msg'), id = card.dataset.id;
    if (b.dataset.a === 'reject' && !confirm('לדחות את הטופס? התמונה שלו תימחק.')) return;
    card.querySelectorAll('button').forEach(x => x.disabled = true); msg.className = 'msg'; msg.textContent = 'שומר...';
    try {
      const r = await api('POST', b.dataset.a === 'approve' ? { action: 'approve', id, person_id: b.dataset.p || undefined } : { action: 'reject', id });
      msg.className = 'msg k';
      msg.textContent = b.dataset.a === 'approve' ? `נשמר: ${r.display_name}${r.photo_on_wall ? ' · התמונה תופיע בצג' : ''}` : 'נדחה';
      items = items.filter(s => s.id !== id);
      setTimeout(render, 1400);
    } catch (e) {
      if (e.message === 'unauthorized') return;
      msg.className = 'msg e'; msg.textContent = e.message; card.querySelectorAll('button').forEach(x => x.disabled = false);
    }
  });

  document.getElementById('tabs').onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
    status = b.dataset.s; load();
  };
  document.getElementById('q').oninput = render;
  load();
})();
</script>
</body>
</html>
